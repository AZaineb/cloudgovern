<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion - CloudGovern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<main class="login">
<form class="card" action="../index.html" method="get">
<div class="brand">
    <img src="../images/logo.svg" alt="">CloudGovern
</div>
<h1>Connexion administrateur</h1>
<label for="email">Adresse e-mail<input id="email" name="email" type="email" required placeholder="admin@entreprise.tn"></label>
<label for="pwd">Mot de passe<input id="pwd" name="pwd" type="password" required></label>
<button class="btn" type="submit">Se connecter</button>
<a href="../index.html">Retour au tableau de bord</a>
</form>
</main>
</body>
</html>
